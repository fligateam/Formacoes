<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Farmácia da Liga - Sistema de Gestão de Formações</title>
  <meta name="theme-color" content="#4A6572">
  <meta name="apple-mobile-web 10 % on the final price (including VAT and shipping) – Important: No commission charged during the first month-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="FormaLiga">
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --color-bg-primary: #F7F1E8;
      --color-bg-secondary: #FFFFFF;
      --color-accent-blue: #D8EFFF;
      --color-accent-green: #DFF3E3;
      --color-text-primary: #4A6572;
      --color-text-secondary: #6B7F8C;
      --color-border: #E0D5C7;
      --color-success: #7BC97F;
      --color-warning: #FFB84D;
      --color-error: #E57373;
      --color-info: #64B5F6;
      --shadow-sm: 0 2px 4px rgba(74,101,114,0.08);
      --shadow-md: 0 4px 12px rgba(74,101,114,0.12);
      --shadow-lg: 0 8px 24px rgba(74,101,114,0.16);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Montserrat', sans-serif; background-color: var(--color-bg-primary); color: var(--color-text-primary); line-height: 1.6; }
    .app-container { display: flex; min-height: 100vh; }
    .sidebar { width: 260px; background: var(--color-bg-secondary); border-right: 1px solid var(--color-border); padding: 0; position: fixed; height: 100vh; overflow-y: auto; box-shadow: var(--shadow-md); z-index: 200; }
    .sidebar-header { padding: 24px 20px; border-bottom: 1px solid var(--color-border); background: linear-gradient(135deg, var(--color-accent-blue), var(--color-accent-green)); }
    .sidebar-header h1 { font-size: 18px; font-weight: 700; color: var(--color-text-primary); margin-bottom: 4px; }
    .sidebar-header p { font-size: 12px; color: var(--color-text-secondary); font-weight: 400; }
    .sidebar-menu { padding: 16px 0; }
    .menu-item { padding: 12px 20px; cursor: pointer; transition: all 0.2s ease; border-left: 3px solid transparent; font-size: 14px; font-weight: 500; color: var(--color-text-secondary); display: flex; align-items: center; gap: 10px; }
    .menu-item:hover { background: var(--color-accent-blue); border-left-color: var(--color-text-primary); color: var(--color-text-primary); }
    .menu-item.active { background: var(--color-accent-blue); border-left-color: var(--color-text-primary); color: var(--color-text-primary); font-weight: 600; }
    .main-content { margin-left: 260px; flex: 1; display: flex; flex-direction: column; }
    .topbar { background: var(--color-bg-secondary); border-bottom: 1px solid var(--color-border); padding: 16px 32px; display: flex; justify-content: space-between; align-items: center; box-shadow: var(--shadow-sm); position: sticky; top: 0; z-index: 100; }
    .user-info { display: flex; align-items: center; gap: 12px; }
    .user-avatar { width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(135deg, var(--color-accent-blue), var(--color-accent-green)); display: flex; align-items: center; justify-content: center; font-weight: 600; color: var(--color-text-primary); font-size: 16px; }
    .user-details h3 { font-size: 14px; font-weight: 600; color: var(--color-text-primary); }
    .user-details p { font-size: 12px; color: var(--color-text-secondary); }
    .content-area { padding: 32px; flex: 1; overflow-y: auto; }
    .btn { padding: 10px 20px; border: none; border-radius: 8px; font-family: 'Montserrat', sans-serif; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.2s ease; display: inline-flex; align-items: center; gap: 8px; }
    .btn-primary { background: var(--color-text-primary); color: white; }
    .btn-primary:hover { background: #3a515e; box-shadow: var(--shadow-md); }
    .btn-secondary { background: var(--color-accent-blue); color: var(--color-text-primary); }
    .btn-secondary:hover { background: #c0e3ff; }
    .btn-success { background: var(--color-success); color: white; }
    .btn-success:hover { background: #6bb56f; }
    .btn-warning { background: var(--color-warning); color: white; }
    .btn-danger { background: var(--color-error); color: white; }
    .btn-danger:hover { background: #d66363; }
    .btn-icon { padding: 8px; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; }
    .card { background: var(--color-bg-secondary); border-radius: 12px; padding: 24px; box-shadow: var(--shadow-md); margin-bottom: 20px; }
    .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 16px; border-bottom: 1px solid var(--color-border); }
    .card-title { font-size: 20px; font-weight: 700; color: var(--color-text-primary); }
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 32px; }
    .stat-card { background: var(--color-bg-secondary); padding: 20px; border-radius: 12px; box-shadow: var(--shadow-md); border-left: 4px solid var(--color-text-primary); }
    .stat-card.blue { border-left-color: var(--color-info); }
    .stat-card.green { border-left-color: var(--color-success); }
    .stat-card.warning { border-left-color: var(--color-warning); }
    .stat-label { font-size: 12px; color: var(--color-text-secondary); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; font-weight: 600; }
    .stat-value { font-size: 32px; font-weight: 700; color: var(--color-text-primary); }
    .form-group { margin-bottom: 20px; }
    .form-label { display: block; font-size: 14px; font-weight: 600; color: var(--color-text-primary); margin-bottom: 8px; }
    .form-control { width: 100%; padding: 12px 16px; border: 1px solid var(--color-border); border-radius: 8px; font-family: 'Montserrat', sans-serif; font-size: 14px; color: var(--color-text-primary); background: var(--color-bg-secondary); transition: all 0.2s ease; }
    .form-control:focus { outline: none; border-color: var(--color-text-primary); box-shadow: 0 0 0 3px rgba(74,101,114,0.1); }
    textarea.form-control { resize: vertical; min-height: 100px; }
    .table-container { overflow-x: auto; border-radius: 12px; box-shadow: var(--shadow-sm); }
    table { width: 100%; border-collapse: collapse; background: var(--color-bg-secondary); }
    thead { background: var(--color-accent-blue); }
    th { padding: 16px; text-align: left; font-size: 13px; font-weight: 700; color: var(--color-text-primary); text-transform: uppercase; letter-spacing: 0.5px; }
    td { padding: 16px; font-size: 14px; color: var(--color-text-primary); border-bottom: 1px solid var(--color-border); }
    tr:hover { background: var(--color-accent-blue); }
    .badge { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.3px; }
    .badge-success { background: var(--color-accent-green); color: var(--color-success); }
    .badge-warning { background: #FFF4E5; color: var(--color-warning); }
    .badge-info { background: var(--color-accent-blue); color: var(--color-info); }
    .badge-error { background: #FFEBEE; color: var(--color-error); }
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center; padding: 20px; }
    .modal.active { display: flex; }
    .modal-content { background: var(--color-bg-secondary); border-radius: 16px; padding: 32px; max-width: 800px; width: 100%; max-height: 90vh; overflow-y: auto; box-shadow: var(--shadow-lg); }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid var(--color-border); }
    .modal-title { font-size: 22px; font-weight: 700; color: var(--color-text-primary); }
    .close-modal { background: none; border: none; font-size: 24px; cursor: pointer; color: var(--color-text-secondary); padding: 0; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; border-radius: 8px; transition: all 0.2s ease; }
    .close-modal:hover { background: var(--color-accent-blue); color: var(--color-text-primary); }
    .rating-group { margin-bottom: 24px; }
    .rating-stars { display: flex; gap: 8px; margin-top: 8px; }
    .star { font-size: 28px; cursor: pointer; color: #E0D5C7; transition: all 0.2s ease; }
    .star:hover, .star.active { color: #FFB84D; }
    .toast { position: fixed; bottom: 24px; right: 24px; background: var(--color-bg-secondary); padding: 16px 24px; border-radius: 12px; box-shadow: var(--shadow-lg); display: none; align-items: center; gap: 12px; z-index: 2000; border-left: 4px solid var(--color-success); }
    .toast.active { display: flex; animation: slideIn 0.3s ease; }
    .toast.error { border-left-color: var(--color-error); }
    @keyframes slideIn { from { transform: translateX(400px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    .filters-bar { background: var(--color-bg-secondary); padding: 16px 24px; border-radius: 12px; margin-bottom: 24px; display: flex; gap: 16px; flex-wrap: wrap; box-shadow: var(--shadow-sm); }
    .filter-item { flex: 1; min-width: 200px; }
    .empty-state { text-align: center; padding: 60px 20px; }
    .empty-state-icon { font-size: 64px; color: var(--color-border); margin-bottom: 16px; }
    .empty-state-text { font-size: 18px; color: var(--color-text-secondary); margin-bottom: 24px; }
    .tabs { display: flex; gap: 8px; border-bottom: 2px solid var(--color-border); margin-bottom: 24px; }
    .tab { padding: 12px 24px; background: none; border: none; font-family: 'Montserrat', sans-serif; font-size: 14px; font-weight: 600; color: var(--color-text-secondary); cursor: pointer; border-bottom: 3px solid transparent; margin-bottom: -2px; transition: all 0.2s ease; }
    .tab:hover { color: var(--color-text-primary); }
    .tab.active { color: var(--color-text-primary); border-bottom-color: var(--color-text-primary); }
    .page { display: none; }
    .page.active { display: block; }
    .training-card { background: var(--color-bg-secondary); border-radius: 12px; padding: 20px; margin-bottom: 16px; box-shadow: var(--shadow-sm); border-left: 4px solid var(--color-info); cursor: pointer; transition: all 0.2s ease; }
    .training-card:hover { box-shadow: var(--shadow-md); transform: translateY(-2px); }
    .training-card.completed { border-left-color: var(--color-success); }
    .training-card.pending { border-left-color: var(--color-warning); }
    .training-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
    .training-title { font-size: 18px; font-weight: 700; color: var(--color-text-primary); margin-bottom: 4px; }
    .training-meta { display: flex; gap: 16px; flex-wrap: wrap; font-size: 13px; color: var(--color-text-secondary); }
    .training-meta-item { display: flex; align-items: center; gap: 6px; }
    .login-container { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .login-card { background: var(--color-bg-secondary); border-radius: 16px; padding: 48px; max-width: 450px; width: 100%; box-shadow: var(--shadow-lg); text-align: center; }
    .login-logo { font-size: 48px; margin-bottom: 16px; }
    .login-title { font-size: 28px; font-weight: 700; color: var(--color-text-primary); margin-bottom: 8px; }
    .login-subtitle { font-size: 14px; color: var(--color-text-secondary); margin-bottom: 32px; }
    .checkbox-item { display: flex; align-items: center; gap: 8px; padding: 8px; border: 1px solid var(--color-border); border-radius: 8px; margin-bottom: 8px; transition: all 0.2s ease; }
    .checkbox-item:hover { background: var(--color-accent-blue); }
    .checkbox-item input[type="checkbox"] { width: 18px; height: 18px; cursor: pointer; }
    .loading { display: none; text-align: center; padding: 40px; }
    .loading.active { display: block; }
    .spinner { border: 4px solid var(--color-border); border-top: 4px solid var(--color-text-primary); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 0 auto 16px; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .participants-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; margin-top: 16px; }
    .section-subtitle { font-size: 13px; color: var(--color-text-secondary); margin-top: -8px; margin-bottom: 16px; }
    .alert-list { display: grid; gap: 12px; }
    .alert-item { background: #FFF7E8; border: 1px solid #FFE1AE; border-radius: 12px; padding: 14px 16px; }
    .kpi-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 8px; }
    .kpi-pill { background: var(--color-accent-blue); color: var(--color-text-primary); padding: 6px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; }
    .month-group { margin-bottom: 28px; }
    .month-title { font-size: 18px; font-weight: 700; margin-bottom: 14px; color: var(--color-text-primary); }
    .actions-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
    .small-text { font-size: 12px; color: var(--color-text-secondary); }
    .proof-upload-box { border: 1px dashed var(--color-border); border-radius: 12px; padding: 12px; background: #fafafa; }
    .dashboard-split { display: grid; grid-template-columns: 1.1fr 0.9fr; gap: 20px; }
    .rank-list { display: grid; gap: 10px; }
    .rank-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 14px; border: 1px solid var(--color-border); border-radius: 10px; background: #fff; }
    .muted-box { background: #F7F9FA; border: 1px solid var(--color-border); border-radius: 12px; padding: 14px; }
    @media (max-width: 980px) { .dashboard-split { grid-template-columns: 1fr; } }
    @media (max-width: 768px) {
      .sidebar { transform: translateX(-100%); transition: transform 0.3s ease; }
      .sidebar.mobile-open { transform: translateX(0); }
      .main-content { margin-left: 0; }
      .stats-grid { grid-template-columns: 1fr; }
      .filters-bar { flex-direction: column; }
      .filter-item { min-width: 100%; }
    }
  </style>
</head>
<body>

  <!-- Login Page -->
  <div id="loginPage" class="page active">
    <div class="login-container">
      <div class="login-card">
        <div class="login-logo">💊</div>
        <h1 class="login-title">Farmácia da Liga</h1>
        <p class="login-subtitle">Sistema de Gestão de Formações</p>
        <form id="loginForm">
          <div class="form-group">
            <label class="form-label" for="email">Email</label>
            <input type="email" id="email" class="form-control" placeholder="seu.email@farmacialiga.pt" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="password">Password</label>
            <input type="password" id="password" class="form-control" required>
          </div>
          <button type="submit" class="btn btn-primary" style="width:100%;margin-top:8px">Entrar</button>
        </form>
      </div>
    </div>
  </div>

  <!-- Dashboard Page -->
  <div id="dashboardPage" class="page">
    <div class="app-container">
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
          <h1>Farmácia da Liga</h1>
          <p>Gestão de Formações</p>
        </div>
        <nav class="sidebar-menu" id="sidebarMenu"></nav>
      </aside>
      <div class="main-content">
        <header class="topbar">
          <div>
            <h2 id="pageTitle" style="font-size:20px;font-weight:700">Dashboard</h2>
          </div>
          <div class="user-info">
            <div class="user-avatar" id="userAvatar">U</div>
            <div class="user-details">
              <h3 id="userName">Utilizador</h3>
              <p id="userRole">Colaborador</p>
            </div>
            <button class="btn btn-secondary btn-icon" onclick="logout()" title="Terminar sessão">🚪</button>
          </div>
        </header>
        <main class="content-area" id="contentArea"></main>
      </div>
    </div>
  </div>

  <!-- Modal Avaliação -->
  <div class="modal" id="avaliacaoModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 class="modal-title">Avaliar Formação</h2>
        <button class="close-modal" onclick="closeModal('avaliacaoModal')">✕</button>
      </div>
      <form id="avaliacaoForm" onsubmit="submitAvaliacao(event)">
        <input type="hidden" id="evalTrainingId">
        <div class="rating-group">
          <label class="form-label">Duração da Ação</label>
          <div class="rating-stars" id="stars-duracao"></div>
          <input type="hidden" id="rating-duracao" required>
        </div>
        <div class="rating-group">
          <label class="form-label">Capacidade Pedagógica do Formador</label>
          <div class="rating-stars" id="stars-pedagogica"></div>
          <input type="hidden" id="rating-pedagogica" required>
        </div>
        <div class="rating-group">
          <label class="form-label">Domínio do Tema pelo Formador</label>
          <div class="rating-stars" id="stars-dominio"></div>
          <input type="hidden" id="rating-dominio" required>
        </div>
        <div class="rating-group">
          <label class="form-label">Relevância para as Tarefas que Desempenha</label>
          <div class="rating-stars" id="stars-relevancia"></div>
          <input type="hidden" id="rating-relevancia" required>
        </div>
        <div class="rating-group">
          <label class="form-label">Avaliação Global da Ação de Formação</label>
          <div class="rating-stars" id="stars-global"></div>
          <input type="hidden" id="rating-global" required>
        </div>
        <div class="form-group">
          <label class="form-label">Os temas abordados afastam-se da prática instituída na Farmácia?</label>
          <select id="afastamentoPratica" class="form-control" required onchange="toggleAfastamentoDetalhe()">
            <option value="">Selecione...</option>
            <option value="nao">Não</option>
            <option value="sim">Sim</option>
          </select>
        </div>
        <div class="form-group" id="detalheAfastamentoGroup" style="display:none">
          <label class="form-label">Por favor justifique</label>
          <textarea id="detalheAfastamento" class="form-control"></textarea>
        </div>
        <div class="form-group">
          <label class="form-label">Observações / Propostas para implementar os conceitos apreendidos</label>
          <textarea id="observacoesPropostas" class="form-control"></textarea>
        </div>
        <div style="display:flex;gap:12px">
          <button type="submit" class="btn btn-primary">Submeter Avaliação</button>
          <button type="button" class="btn btn-secondary" onclick="closeModal('avaliacaoModal')">Cancelar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal Colaborador -->
  <div class="modal" id="colaboradorModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 class="modal-title" id="colaboradorModalTitle">Adicionar Colaborador</h2>
        <button class="close-modal" onclick="closeModal('colaboradorModal')">✕</button>
      </div>
      <form id="colaboradorForm" onsubmit="submitColaborador(event)">
        <input type="hidden" id="colaboradorId">
        <div class="form-group">
          <label class="form-label" for="colabNome">Nome Display</label>
          <input type="text" id="colabNome" class="form-control" required placeholder="Ex: Dra. Ana Silva">
        </div>
        <div class="form-group">
          <label class="form-label" for="colabNomeCompleto">Nome Completo</label>
          <input type="text" id="colabNomeCompleto" class="form-control" placeholder="Nome completo legal">
        </div>
        <div class="form-group">
          <label class="form-label" for="colabCodigoOperador">Código de Operador</label>
          <input type="text" id="colabCodigoOperador" class="form-control" placeholder="Ex: OP001">
        </div>
        <div class="form-group">
          <label class="form-label" for="colabNIF">NIF</label>
          <input type="text" id="colabNIF" class="form-control" placeholder="Ex: 123456789" maxlength="9">
        </div>
        <div class="form-group">
          <label class="form-label" for="colabCedula">Nº Cédula / Carteira Profissional</label>
          <input type="text" id="colabCedula" class="form-control" placeholder="Ex: C-12345">
        </div>
        <div class="form-group">
          <label class="form-label" for="colabEmail">Email</label>
          <input type="email" id="colabEmail" class="form-control" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="colabFuncao">Função</label>
          <select id="colabFuncao" class="form-control" required>
            <option value="">Selecione...</option>
            <option value="Farmacêutico">Farmacêutico</option>
            <option value="Técnico de Farmácia">Técnico de Farmácia</option>
            <option value="Auxiliar">Auxiliar</option>
            <option value="Gestor">Gestor</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label" for="colabRole">Perfil</label>
          <select id="colabRole" class="form-control" required>
            <option value="colaborador">Colaborador</option>
            <option value="gestorformacao">Gestor de Formação</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label" for="colabAtivo">Estado</label>
          <select id="colabAtivo" class="form-control" required>
            <option value="true">Ativo</option>
            <option value="false">Inativo</option>
          </select>
        </div>
        <div style="display:flex;gap:12px">
          <button type="submit" class="btn btn-primary">Guardar</button>
          <button type="button" class="btn btn-secondary" onclick="closeModal('colaboradorModal')">Cancelar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal Participantes -->
  <div class="modal" id="participantesModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 class="modal-title">Gerir Participantes</h2>
        <button class="close-modal" onclick="closeModal('participantesModal')">✕</button>
      </div>
      <input type="hidden" id="participantesTrainingId">
      <div class="form-group">
        <button type="button" class="btn btn-success" onclick="selecionarTodos()">Selecionar Todos</button>
        <button type="button" class="btn btn-secondary" onclick="desselecionarTodos()" style="margin-left:8px">Desselecionar Todos</button>
      </div>
      <div id="participantesContainer" class="participants-grid"></div>
      <div style="display:flex;gap:12px;margin-top:24px;padding-top:16px;border-top:1px solid var(--color-border)">
        <button type="button" class="btn btn-primary" onclick="salvarParticipantes()">Guardar</button>
        <button type="button" class="btn btn-secondary" onclick="closeModal('participantesModal')">Cancelar</button>
      </div>
    </div>
  </div>

  <!-- Modal Detalhe Formação -->

  <!-- ═══════════════════════════════════════════════════════
       FIREBASE — carregamento mínimo:
       Só app + auth no início.
       Firestore é carregado 1x após login (lazy).
       Storage é carregado apenas quando necessário (upload).
  ═══════════════════════════════════════════════════════ -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

  <script>
    /* ── Configuração Firebase ── */
    const firebaseConfig = {
      apiKey: "AIzaSyAhBfZ9x8odvenh2x5PTFMDPeGUhD-JvDc",
      authDomain: "formacoes-liga.firebaseapp.com",
      projectId: "formacoes-liga",
      storageBucket: "formacoes-liga.firebasestorage.app",
      messagingSenderId: "788115326428",
      appId: "1:788115326428:web:baa086d5622e92440afb19"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    /* ── Lazy loaders — só carregam 1 vez ── */
    let _db = null, _storage = null;

    function loadScript(src) {
      return new Promise((resolve, reject) => {
        const s = document.createElement('script');
        s.src = src;
        s.onload = resolve;
        s.onerror = reject;
        document.head.appendChild(s);
      });
    }

    async function getDb() {
      if (_db) return _db;
      await loadScript('https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js');
      _db = firebase.firestore();
      /* Cache agressivo offline */
      _db.settings({ cacheSizeBytes: firebase.firestore.CACHE_SIZE_UNLIMITED });
      try { await _db.enablePersistence({ synchronizeTabs: true }); } catch(e) { /* já ativo ou incognito */ }
      return _db;
    }

    async function getStorage() {
      if (_storage) return _storage;
      await loadScript('https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js');
      _storage = firebase.storage();
      return _storage;
    }

    /* ── Estado global ── */
    let currentUser = null;
    let currentUserData = null;
    let db = null; /* alias preenchido após login */

    /* ── Cache em memória (reduz leituras Firestore) ── */
    const _cache = { users: null, trainings: null, attendance: null, evaluations: null };
    function clearCache() { Object.keys(_cache).forEach(k => _cache[k] = null); }

    /* ─────────────────────────────────────────
       AUTH
    ───────────────────────────────────────── */
    auth.onAuthStateChanged(async user => {
      if (!user) {
        currentUser = null;
        currentUserData = null;
        clearCache();
        showLogin();
        return;
      }
      currentUser = user;
      db = await getDb();
      await loadUserData(user.uid);

      /* Seed para as 3 gestoras padrão */
      if (!currentUserData) {
        const email = user.email?.toLowerCase();
        const gestoresSeed = {
          'fligadebora@hotmail.com': { nome: 'Débora', funcao: 'Gestão', role: 'gestorformacao' },
          'fligamarta@hotmail.com':  { nome: 'Marta',  funcao: 'Gestão', role: 'gestorformacao' },
          'farmacialiga@gaia.pt':    { nome: 'Dra. Rita S.', funcao: 'Gestão', role: 'gestorformacao' }
        };
        const seed = gestoresSeed[email];
        if (seed) {
          try {
            await db.collection('users').doc(user.uid).set({
              nome: seed.nome, email: user.email, funcao: seed.funcao,
              role: seed.role, ativo: true,
              createdAt: firebase.firestore.FieldValue.serverTimestamp()
            }, { merge: true });
            await loadUserData(user.uid);
          } catch(e) { console.error('Erro seed:', e); }
        }
      }
      showDashboard();
    });

    async function loadUserData(uid) {
      try {
        const doc = await db.collection('users').doc(uid).get();
        if (doc.exists) {
          currentUserData = { id: uid, ...doc.data() };
          updateUserInterface();
        }
      } catch(e) { console.error('Erro loadUserData:', e); }
    }

    document.getElementById('loginForm').addEventListener('submit', async e => {
      e.preventDefault();
      const email    = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      try {
        await auth.signInWithEmailAndPassword(email, password);
        showToast('Login realizado com sucesso!', 'success');
      } catch(e) {
        console.error(e);
        showToast('Erro ao fazer login. Verifique as credenciais.', 'error');
      }
    });

    function logout() { auth.signOut(); }

    /* ─────────────────────────────────────────
       UI helpers
    ───────────────────────────────────────── */
    function showLogin() {
      document.getElementById('loginPage').classList.add('active');
      document.getElementById('dashboardPage').classList.remove('active');
    }

    function showDashboard() {
      document.getElementById('loginPage').classList.remove('active');
      document.getElementById('dashboardPage').classList.add('active');
      buildMenu();
      const isGestor = currentUserData?.role === 'gestorformacao';
      navigateTo(isGestor ? 'todasFormacoes' : 'minhasFormacoes');
    }

    function updateUserInterface() {
      if (!currentUserData) return;
      document.getElementById('userName').textContent  = currentUserData.nome || 'Utilizador';
      document.getElementById('userRole').textContent  = currentUserData.role === 'gestorformacao' ? 'Gestor de Formação' : 'Colaborador';
      const initials = currentUserData.nome
        ? currentUserData.nome.split(' ').map(n => n[0]).join('').substring(0, 2).toUpperCase()
        : 'U';
      document.getElementById('userAvatar').textContent = initials;
    }

    function buildMenu() {
      const menu = document.getElementById('sidebarMenu');
      const isGestor = currentUserData?.role === 'gestorformacao';
      const items = isGestor ? [
        ['todasFormacoes',     'Todas as Formações',       '📋'],
        ['criarFormacao',      'Criar Formação',            '➕'],
        ['colaboradores',      'Colaboradores',             '👥'],
        ['necessidadesFormacao','Necessidades de Formação', '📝'],
        ['relatorios',         'Relatórios e Exportação',  '📊'],
        ['sep', 'Área Pessoal', ''],
        ['minhasFormacoes',    'As Minhas Formações',       '📚'],
        ['manifestarNecessidade','Necessidade de Formação', '💡'],
        ['historicoAvaliacoes','Histórico de Avaliações',  '⭐'],
      ] : [
        ['minhasFormacoes',    'As Minhas Formações',       '📚'],
        ['manifestarNecessidade','Necessidade de Formação', '💡'],
        ['historicoAvaliacoes','Histórico de Avaliações',  '⭐'],
      ];
      menu.innerHTML = items.map(([id, label, icon]) =>
        id === 'sep'
          ? `<div style="padding:8px 20px;margin:8px 0;border-bottom:1px solid var(--color-border)"><small style="color:var(--color-text-secondary);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.5px">${label}</small></div>`
          : `<div class="menu-item" data-page="${id}" onclick="navigateTo('${id}',this)"><span>${icon}</span><span>${label}</span></div>`
      ).join('');
    }

    function navigateTo(pageId, el) {
      document.querySelectorAll('.menu-item').forEach(i => i.classList.remove('active'));
      if (el) el.classList.add('active');
      else document.querySelector(`.menu-item[data-page="${pageId}"]`)?.classList.add('active');
      document.getElementById('pageTitle').textContent = pageId;
      const isGestor = currentUserData?.role === 'gestorformacao';
      switch(pageId) {
        case 'minhasFormacoes':      loadMinhasFormacoes();       break;
        case 'manifestarNecessidade':loadManifestarNecessidade(); break;
        case 'historicoAvaliacoes':  loadHistoricoAvaliacoes();   break;
        case 'todasFormacoes':       if (isGestor) loadTodasFormacoes();       break;
        case 'criarFormacao':        if (isGestor) loadCriarFormacao();        break;
        case 'colaboradores':        if (isGestor) loadColaboradores();        break;
        case 'necessidadesFormacao': if (isGestor) loadNecessidadesGestor();   break;
        case 'relatorios':           if (isGestor) loadRelatorios();           break;
        default: loadMinhasFormacoes();
      }
    }

    /* ─────────────────────────────────────────
       CACHE helpers (reduzem leituras Firebase)
    ───────────────────────────────────────── */
    async function getUsersMap(forceRefresh = false) {
      if (!forceRefresh && _cache.users) return _cache.users;
      const snap = await db.collection('users').get();
      _cache.users = {};
      snap.forEach(doc => { _cache.users[doc.id] = { id: doc.id, ...doc.data() }; });
      return _cache.users;
    }

    async function getAllTrainings(forceRefresh = false) {
      if (!forceRefresh && _cache.trainings) return _cache.trainings;
      const snap = await db.collection('trainings').get();
      _cache.trainings = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
      return _cache.trainings;
    }

    async function getAttendanceMap(forceRefresh = false) {
      if (!forceRefresh && _cache.attendance) return _cache.attendance;
      const snap = await db.collection('attendance').get();
      _cache.attendance = {};
      snap.forEach(doc => {
        const d = doc.data();
        if (d.trainingId && d.userId) _cache.attendance[d.trainingId + d.userId] = { id: doc.id, ...d };
      });
      return _cache.attendance;
    }

    async function getEvaluationsMap(forceRefresh = false) {
      if (!forceRefresh && _cache.evaluations) return _cache.evaluations;
      const snap = await db.collection('evaluations').get();
      _cache.evaluations = {};
      snap.forEach(doc => {
        const d = doc.data();
        if (d.trainingId && d.userId) _cache.evaluations[d.trainingId + d.userId] = { id: doc.id, ...d };
      });
      return _cache.evaluations;
    }

    /* ─────────────────────────────────────────
       COLABORADOR — Minhas Formações
    ───────────────────────────────────────── */
    async function loadMinhasFormacoes() {
      document.getElementById('pageTitle').textContent = 'As Minhas Formações';
      document.getElementById('contentArea').innerHTML = `
        <div class="stats-grid">
          <div class="stat-card blue"><div class="stat-label">Formações Futuras</div><div class="stat-value" id="statFuturas">-</div></div>
          <div class="stat-card green"><div class="stat-label">Formações Concluídas</div><div class="stat-value" id="statConcluidas">-</div></div>
          <div class="stat-card warning"><div class="stat-label">Por Avaliar</div><div class="stat-value" id="statPorAvaliar">-</div></div>
          <div class="stat-card"><div class="stat-label">Total de Horas</div><div class="stat-value" id="statHoras">-</div></div>
        </div>
        <div class="card">
          <div class="card-header"><h2 class="card-title">Formações</h2></div>
          <div id="formacoesContainer">
            <div class="loading active"><div class="spinner"></div><p>A carregar formações...</p></div>
          </div>
        </div>`;
      await carregarMinhasFormacoes();
    }

    async function carregarMinhasFormacoes() {
      try {
        /* 1 leitura de enrollments filtrada por user — não usa cache pois é específica */
        const enrollSnap = await db.collection('enrollments').where('userId', '==', currentUser.uid).get();
        if (enrollSnap.empty) {
          document.getElementById('formacoesContainer').innerHTML = emptyState('Ainda não tem formações atribuídas');
          updateStats([]);
          return;
        }
        const trainingIds = enrollSnap.docs.map(d => d.data().trainingId);
        /* Usa cache de trainings */
        const allTrainings = await getAllTrainings();
        const trainings = trainingIds.map(tid => {
          const t = allTrainings.find(x => x.id === tid);
          if (!t) return null;
          const en = enrollSnap.docs.find(d => d.data().trainingId === tid);
          return { ...t, enrollment: { id: en.id, ...en.data() } };
        }).filter(Boolean);
        renderFormacoes(trainings);
        updateStats(trainings);
      } catch(e) { console.error(e); showToast('Erro ao carregar formações', 'error'); }
    }

    function renderFormacoes(trainings) {
      const container = document.getElementById('formacoesContainer');
      if (!trainings.length) { container.innerHTML = emptyState('Nenhuma formação encontrada'); return; }
      container.innerHTML = trainings.map(t => {
        const date = t.data?.seconds ? new Date(t.data.seconds * 1000) : new Date();
        const isFuture = date > new Date();
        const canEval  = t.avaliacaoAutorizada && t.enrollment?.estadoInscricao === 'Presente' && !t.enrollment?.avaliado;
        return `<div class="training-card ${isFuture ? 'pending' : 'completed'}">
          <div class="training-header">
            <div>
              <h3 class="training-title">${t.tema || 'Sem título'}</h3>
              <div class="training-meta">
                <span class="training-meta-item">📅 ${date.toLocaleDateString('pt-PT')}</span>
                <span class="training-meta-item">⏱ ${t.duracaoHoras || 0}h</span>
                <span class="training-meta-item">👤 ${t.formador || 'N/A'}</span>
                ${t.laboratorioMarca ? `<span class="training-meta-item">🏷 ${t.laboratorioMarca}</span>` : ''}
              </div>
            </div>
            <div>
              <span class="badge ${isFuture ? 'badge-info' : 'badge-success'}">${isFuture ? 'Agendada' : 'Concluída'}</span>
              ${canEval ? `<button class="btn btn-warning" style="margin-left:8px" onclick="abrirAvaliacao('${t.id}')">Avaliar</button>` : ''}
            </div>
          </div>
        </div>`;
      }).join('');
    }

    function updateStats(trainings) {
      const now = new Date();
      document.getElementById('statFuturas').textContent   = trainings.filter(t => new Date(t.data?.seconds*1000) > now).length;
      document.getElementById('statConcluidas').textContent= trainings.filter(t => new Date(t.data?.seconds*1000) <= now).length;
      document.getElementById('statPorAvaliar').textContent= trainings.filter(t => t.avaliacaoAutorizada && t.enrollment?.estadoInscricao==='Presente' && !t.enrollment?.avaliado).length;
      document.getElementById('statHoras').textContent     = trainings.reduce((s,t) => s+(t.duracaoHoras||0), 0);
    }

    /* ─────────────────────────────────────────
       AVALIAÇÃO
    ───────────────────────────────────────── */
    function abrirAvaliacao(trainingId) {
      document.getElementById('evalTrainingId').value = trainingId;
      initRatingStars();
      openModal('avaliacaoModal');
    }

    function initRatingStars() {
      ['duracao','pedagogica','dominio','relevancia','global'].forEach(field => {
        const container = document.getElementById('stars-' + field);
        container.innerHTML = '';
        for (let i = 1; i <= 5; i++) {
          const star = document.createElement('span');
          star.className = 'star';
          star.textContent = '★';
          star.onclick = () => setRating(field, i);
          container.appendChild(star);
        }
      });
    }

    function setRating(field, value) {
      document.getElementById('rating-' + field).value = value;
      document.querySelectorAll('#stars-' + field + ' .star').forEach((s, idx) => {
        s.classList.toggle('active', idx < value);
      });
    }

    function toggleAfastamentoDetalhe() {
      const val = document.getElementById('afastamentoPratica').value;
      const grp = document.getElementById('detalheAfastamentoGroup');
      const ta  = document.getElementById('detalheAfastamento');
      grp.style.display = val === 'sim' ? 'block' : 'none';
      ta.required = val === 'sim';
      if (val !== 'sim') ta.value = '';
    }

    async function submitAvaliacao(event) {
      event.preventDefault();
      const trainingId = document.getElementById('evalTrainingId').value;
      for (const campo of ['duracao','pedagogica','dominio','relevancia','global']) {
        if (!document.getElementById('rating-' + campo).value) {
          showToast('Por favor classifique todos os critérios com estrelas antes de submeter.', 'error');
          return;
        }
      }
      const afastaPratica = document.getElementById('afastamentoPratica').value === 'sim';
      try {
        await db.collection('evaluations').add({
          trainingId,
          userId: currentUser.uid,
          duracaoAcao:                    parseInt(document.getElementById('rating-duracao').value),
          capacidadePedagogicaFormador:   parseInt(document.getElementById('rating-pedagogica').value),
          dominioTemaFormador:            parseInt(document.getElementById('rating-dominio').value),
          relevanciaParaTarefas:          parseInt(document.getElementById('rating-relevancia').value),
          avaliacaoGlobal:                parseInt(document.getElementById('rating-global').value),
          afastaDaPratica: afastaPratica,
          detalheAfastamento: afastaPratica ? document.getElementById('detalheAfastamento').value : '',
          observacoesPropostas: document.getElementById('observacoesPropostas').value,
          dataSubmissao: firebase.firestore.FieldValue.serverTimestamp()
        });
        const enSnap = await db.collection('enrollments')
          .where('trainingId','==',trainingId).where('userId','==',currentUser.uid).get();
        if (!enSnap.empty) await db.collection('enrollments').doc(enSnap.docs[0].id).update({ avaliado: true });
        _cache.evaluations = null; /* invalida cache */
        showToast('Avaliação submetida com sucesso!', 'success');
        closeModal('avaliacaoModal');
        document.getElementById('avaliacaoForm').reset();
        loadMinhasFormacoes();
      } catch(e) { console.error(e); showToast('Erro ao submeter avaliação', 'error'); }
    }

    /* ─────────────────────────────────────────
       MANIFESTAR NECESSIDADE
    ───────────────────────────────────────── */
    function loadManifestarNecessidade() {
      document.getElementById('pageTitle').textContent = 'Manifestar Necessidade de Formação';
      document.getElementById('contentArea').innerHTML = `
        <div class="card">
          <div class="card-header"><h2 class="card-title">Nova Necessidade de Formação</h2></div>
          <form id="necessidadeForm" onsubmit="submitNecessidade(event)">
            <div class="form-group"><label class="form-label">Tema / Necessidade de Formação</label><input type="text" id="temaNecessidade" class="form-control" placeholder="Ex: Gestão de stock de medicamentos" required></div>
            <div class="form-group"><label class="form-label">Urgência</label>
              <select id="urgencia" class="form-control" required>
                <option value="">Selecione...</option>
                <option value="Baixa">Baixa</option><option value="Media">Média</option>
                <option value="Alta">Alta</option><option value="Critica">Crítica</option>
              </select>
            </div>
            <div class="form-group"><label class="form-label">Marca ou Laboratório</label><input type="text" id="laboratorio" class="form-control" placeholder="Ex: Bayer, Roche, etc."></div>
            <div class="form-group"><label class="form-label">Comentários Adicionais</label><textarea id="comentarios" class="form-control" placeholder="Informações adicionais sobre a necessidade de formação"></textarea></div>
            <button type="submit" class="btn btn-primary">Submeter Pedido</button>
          </form>
        </div>
        <div class="card">
          <div class="card-header"><h2 class="card-title">Histórico de Pedidos</h2></div>

        </div>`;
      carregarHistoricoNecessidades();

    async function submitNecessidade(event) {
      event.preventDefault();
      try {
        await db.collection('trainingNeeds').add({
          userId: currentUser.uid,
          nomeColaborador: currentUserData.nome,
          temaNecessidade: document.getElementById('temaNecessidade').value,
          urgencia:        document.getElementById('urgencia').value,

        });

      } catch(e) { showToast('Erro ao submeter pedido', 'error'); }

    async function carregarHistoricoNecessidades() {
      try {
        const snap = await db.collection('trainingNeeds').where('userId','==',currentUser.uid).orderBy('createdAt','desc').get();

        if (snap.empty) { container.innerHTML = emptyState('Ainda não submeteu pedidos de formação'); return; }

          <tbody>${snap.docs.map(doc => {
            const d = doc.data();
            const date = d.createdAt ? new Date(d.createdAt.seconds*1000) : new Date();

              <td><span class="badge badge-${getUrgenciaBadge(d.urgencia)}">${d.urgencia}</span></td>
              <td>${d.laboratorioMarca||'-'}</td>
              <td><span class="badge badge-${getEstadoBadge(d.estado)}">${d.estado}</span></td></tr>`;

    /* ─────────────────────────────────────────
       HISTÓRICO AVALIAÇÕES
    ───────────────────────────────────────── */
    function loadHistoricoAvaliacoes() {
      document.getElementById('pageTitle').textContent = 'Histórico de Avaliações';
      document.getElementById('contentArea').innerHTML = `
        <div class="card">
          <div class="card-header"><h2 class="card-title">Minhas Avaliações Submetidas</h2></div>
          <div id="avaliacoesContainer"><div class="loading active"><div class="spinner"></div><p>A carregar avaliações...</p></div></div>
        </div>`;
      carregarAvaliacoes();
    }

    async function carregarAvaliacoes() {
      try {
        const snap = await db.collection('evaluations').where('userId','==',currentUser.uid).orderBy('dataSubmissao','desc').get();
        const container = document.getElementById('avaliacoesContainer');
        if (snap.empty) { container.innerHTML = emptyState('Ainda não submeteu avaliações'); return; }
        const allT = await getAllTrainings();
        const trainMap = Object.fromEntries(allT.map(t => [t.id, t]));
        container.innerHTML = `<div class="table-container"><table>
          <thead><tr><th>Data Avaliação</th><th>Formação</th><th>Formador</th><th>Avaliação Global</th></tr></thead>
          <tbody>${snap.docs.map(doc => {
            const ev = doc.data();
            const t  = trainMap[ev.trainingId] || {};
            const date = ev.dataSubmissao ? new Date(ev.dataSubmissao.seconds*1000) : new Date();
            return `<tr><td>${date.toLocaleDateString('pt-PT')}</td><td>${t.tema||'N/A'}</td>
              <td>${t.formador||'N/A'}</td>
              <td>${'★'.repeat(ev.avaliacaoGlobal||0)}${'☆'.repeat(5-(ev.avaliacaoGlobal||0))}</td></tr>`;
          }).join('')}</tbody></table></div>`;
      } catch(e) { console.error(e); }
    }

    /* ─────────────────────────────────────────
       GESTOR — Todas as Formações
    ───────────────────────────────────────── */
    async function loadTodasFormacoes() {
      document.getElementById('pageTitle').textContent = 'Gestão de Formações';
      document.getElementById('contentArea').innerHTML = `
        <div class="card" style="margin-bottom:24px">
          <div class="card-header">
            <h2 class="card-title">Todas as Formações</h2>
            <button class="btn btn-primary" onclick="navigateTo('criarFormacao')">+ Nova Formação</button>
          </div>
          <div id="todasFormacoesContainer"><div class="loading active"><div class="spinner"></div><p>A carregar formações...</p></div></div>
        </div>`;
      await carregarTodasFormacoes();
    }

    async function carregarTodasFormacoes() {
      try {
        /* Usa cache; invalida só após mutações */
        const trainings = await getAllTrainings();
        const container = document.getElementById('todasFormacoesContainer');
        if (!trainings.length) {
          container.innerHTML = `<div class="empty-state"><div class="empty-state-icon">📋</div><p class="empty-state-text">Nenhuma formação criada ainda</p><button class="btn btn-primary" onclick="navigateTo('criarFormacao')">Criar Primeira Formação</button></div>`;
          return;
        }
        /* Buscar contagem de inscritos em batch único por trainingId */
        const enrollSnap = await db.collection('enrollments').get();
        const enrollCount = {};
        enrollSnap.forEach(doc => {
          const tid = doc.data().trainingId;
          enrollCount[tid] = (enrollCount[tid] || 0) + 1;
        });
        renderTodasFormacoes(trainings.map(t => ({ ...t, numParticipantes: enrollCount[t.id] || 0 })));
      } catch(e) { console.error(e); showToast('Erro ao carregar formações', 'error'); }
    }

      const container = document.getElementById('todasFormacoesContainer');
      container.innerHTML = `<div class="table-container"><table>
        <thead><tr><th>Data</th><th>Tema</th><th>Formador</th><th>Duração</th><th>Participantes</th><th>Estado</th><th>Ações</th></tr></thead>
        <tbody>${trainings.sort((a,b) => (b.data?.seconds||0)-(a.data?.seconds||0)).map(t => {
          const date = t.data?.seconds ? new Date(t.data.seconds*1000) : new Date();
          return `<tr>

        showToast('Avaliação autorizada! Colaboradores podem agora avaliar.', 'success');
        carregarTodasFormacoes();

    }

    async function eliminarFormacao(trainingId) {
      if (!confirm('Tem certeza que deseja eliminar esta formação? Esta ação não pode ser revertida.')) return;
      try {
        const batch = db.batch();
        const enrollSnap = await db.collection('enrollments').where('trainingId','==',trainingId).get();
        enrollSnap.forEach(doc => batch.delete(doc.ref));
        const evalSnap = await db.collection('evaluations').where('trainingId','==',trainingId).get();
        evalSnap.forEach(doc => batch.delete(doc.ref));
        batch.delete(db.collection('trainings').doc(trainingId));
        await batch.commit();
        _cache.trainings = null; _cache.evaluations = null;
        showToast('Formação eliminada com sucesso!', 'success');
        carregarTodasFormacoes();
      } catch(e) { showToast('Erro ao eliminar formação', 'error'); }
    }

    async function salvarParticipantes() {
      const trainingId = document.getElementById('participantesTrainingId').value;
      const checks = document.querySelectorAll('#participantesContainer input[type=checkbox]');
      try {
        const current = await db.collection('enrollments').where('trainingId','==',trainingId).get();
        const batch = db.batch();
        current.forEach(doc => batch.delete(doc.ref));
        checks.forEach(cb => {
          if (cb.checked) {
            const ref = db.collection('enrollments').doc();
            batch.set(ref, { trainingId, userId: cb.value, estadoInscricao: 'Convocado', foiConvocadoPeloGestor: true, validadoPeloGestor: true, presencaConfirmadaPeloGestor: false, avaliado: false, createdAt: firebase.firestore.FieldValue.serverTimestamp() });
          }
        });
        await batch.commit();
        showToast('Participantes atualizados com sucesso!', 'success');
        closeModal('participantesModal');
        carregarTodasFormacoes();
      } catch(e) { showToast('Erro ao salvar participantes', 'error'); }
    }

    async function submitColaborador(event) {
      event.preventDefault();
      const colaboradorId  = document.getElementById('colaboradorId').value;
      const nome           = document.getElementById('colabNome').value.trim();
      const nomeCompleto   = document.getElementById('colabNomeCompleto').value.trim();
      const codigoOperador = document.getElementById('colabCodigoOperador').value.trim();
      const nif            = document.getElementById('colabNIF').value.trim();
      const cedula         = document.getElementById('colabCedula').value.trim();
      const email          = document.getElementById('colabEmail').value.trim();
      const funcao         = document.getElementById('colabFuncao').value;
      const role           = document.getElementById('colabRole').value;
      const ativo          = document.getElementById('colabAtivo').value === 'true';
      if (!nome || !email) { showToast('Nome e email são obrigatórios', 'error'); return; }
      try {
        let uid = colaboradorId;
        if (!colaboradorId) {
          try {
            const cred = await auth.createUserWithEmailAndPassword(email, 'Farmacia123!');
            uid = cred.user.uid;
          } catch(e) {
            if (e.code === 'auth/email-already-in-use') {
              const snap = await db.collection('users').where('email','==',email).limit(1).get();
              if (snap.empty) { showToast('Email já existe no Auth mas não registado como utilizador', 'error'); return; }
              uid = snap.docs[0].id;
              showToast('Email já existe. A atualizar dados...', 'info');
            } else { throw e; }
          }
        }
        await db.collection('users').doc(uid).set(
          { nome, nomeCompleto, codigoOperador, nif, cedula, email, funcao, role, ativo, updatedAt: firebase.firestore.FieldValue.serverTimestamp() },
          { merge: true }
        );
        _cache.users = null;
        showToast(colaboradorId ? 'Colaborador atualizado!' : 'Colaborador criado! Password: Farmacia123!', 'success');
        closeModal('colaboradorModal');
        carregarColaboradores();
      } catch(e) { console.error(e); showToast('Erro: ' + e.message, 'error'); }
    }

    async function exportarTodosDados() {
      showToast('A preparar exportação...', 'info');
      try {
        const [trainings, usersMap, evalSnap, needsSnap] = await Promise.all([
          getAllTrainings(), getUsersMap(),
          db.collection('evaluations').get(),
          db.collection('trainingNeeds').orderBy('createdAt','desc').get()
        ]);
        let csvF = 'Data,Tema,Formador,Duração h,Laboratório,Local,Estado\n';
        trainings.forEach(t => {
          const d = t.data?.seconds ? new Date(t.data.seconds*1000).toLocaleDateString('pt-PT') : '-';
          csvF += `${d},"${t.tema}","${t.formador||''}",${t.duracaoHoras||0},"${t.laboratorioMarca||''}","${t.local||''}","${t.estado||''}"\n`;
        });
        let csvU = 'Nome,Email,Função,Role,Estado\n';
        Object.values(usersMap).forEach(u => {
          csvU += `"${u.nome||''}","${u.email||''}","${u.funcao||''}","${u.role||''}","${u.ativo?'Ativo':'Inativo'}"\n`;
        });
        let csvE = 'Data,Formação ID,User ID,Duração,Pedagógica,Domínio,Relevância,Global,Afasta Prática\n';
        evalSnap.forEach(doc => {
          const e = doc.data();
          const d = e.dataSubmissao?.seconds ? new Date(e.dataSubmissao.seconds*1000).toLocaleDateString('pt-PT') : '-';
          csvE += `${d},"${e.trainingId}","${e.userId}",${e.duracaoAcao||0},${e.capacidadePedagogicaFormador||0},${e.dominioTemaFormador||0},${e.relevanciaParaTarefas||0},${e.avaliacaoGlobal||0},"${e.afastaDaPratica?'Sim':'Não'}"\n`;
        });
        let csvN = 'Data,Colaborador,Tema,Urgência,Laboratório,Estado\n';
        needsSnap.forEach(doc => {
          const n = doc.data();
          const d = n.createdAt?.seconds ? new Date(n.createdAt.seconds*1000).toLocaleDateString('pt-PT') : '-';
          csvN += `${d},"${n.nomeColaborador||''}","${n.temaNecessidade||''}","${n.urgencia||''}","${n.laboratorioMarca||''}","${n.estado||''}"\n`;
        });
        downloadCSV(csvF, 'formacoes.csv');
        setTimeout(() => downloadCSV(csvU, 'colaboradores.csv'), 500);
        setTimeout(() => downloadCSV(csvE, 'avaliacoes.csv'), 1000);
        setTimeout(() => downloadCSV(csvN, 'necessidades.csv'), 1500);
        showToast('Ficheiros CSV exportados com sucesso!', 'success');
      } catch(e) { showToast('Erro ao exportar dados', 'error'); }
    }

    async function exportarPlanoFormacoes() {
      showToast('A preparar exportação...', 'info');
      try {
        const dataInicio = document.getElementById('exportDataInicio')?.value;
        const dataFim    = document.getElementById('exportDataFim')?.value;
        const entidade   = document.getElementById('exportEntidade')?.value.toLowerCase().trim();
        const trainings  = await getAllTrainings();
        let csv = 'Data,Tema,Entidade Formadora,Formador,Local,Duração (h),Estado\n';
        trainings.forEach(t => {
          let dt = t.data?.seconds ? new Date(t.data.seconds*1000) : null;
          if (dataInicio && dt && dt < new Date(dataInicio)) return;
          if (dataFim    && dt && dt > new Date(dataFim+'T23:59:59')) return;
          if (entidade   && !(t.entidadeFormadora||'').toLowerCase().includes(entidade)) return;
          const d = dt ? dt.toLocaleDateString('pt-PT') : '-';
          csv += `${d},"${t.tema||''}","${t.entidadeFormadora||''}","${t.formador||''}","${t.local||''}",${t.duracaoHoras||0},"${t.estado||''}"\n`;
        });
        downloadCSV(csv, `plano-formacoes-${new Date().toISOString().slice(0,10)}.csv`);
        showToast('Plano exportado com sucesso!', 'success');
      } catch(e) { showToast('Erro ao exportar plano', 'error'); }
    }

    function downloadCSV(content, filename) {
      const blob = new Blob(['\uFEFF' + content], { type: 'text/csv;charset=utf-8;' });
      const link  = document.createElement('a');
      link.href   = URL.createObjectURL(blob);
      link.download = filename;
      link.style.display = 'none';
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    /* ─────────────────────────────────────────
       UTILITÁRIOS
    ───────────────────────────────────────── */
    function openModal(id)  { document.getElementById(id).classList.add('active'); }
    function closeModal(id) { document.getElementById(id).classList.remove('active'); }

    let _toastTimer = null;
    function showToast(message, type = 'success') {
      const toast = document.getElementById('toast');
      const icon  = document.getElementById('toastIcon');
      const msg   = document.getElementById('toastMessage');
      toast.className = 'toast active' + (type === 'error' ? ' error' : '');
      icon.textContent  = type === 'error' ? '❌' : type === 'info' ? 'ℹ️' : '✅';
      msg.textContent   = message;
      if (_toastTimer) clearTimeout(_toastTimer);
      _toastTimer = setTimeout(() => toast.classList.remove('active'), 3500);
    }

    function emptyState(text) {
      return `<div class="empty-state"><div class="empty-state-icon">📭</div><p class="empty-state-text">${text}</p></div>`;
    }

    function getUrgenciaBadge(u) { return { Baixa:'info', Media:'warning', Alta:'warning', Critica:'error' }[u] || 'info'; }
    function getEstadoBadge(e)   { return { Submetida:'info', 'Em análise':'warning', Planeada:'success', Rejeitada:'error' }[e] || 'info'; }
    function getEstadoBadgeClass(e) { return { Rascunho:'info', Agendada:'info', Concluida:'success', 'Em avaliação':'warning', Cancelada:'error' }[e] || 'info'; }
  </script>
